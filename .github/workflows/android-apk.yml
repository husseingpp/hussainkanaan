name: Build Android APK (SunSpot)

# Builds a standalone, installable Android APK for the Golden Hour Explorer
# Expo app and publishes it to a stable GitHub Release so it can be sideloaded
# for testing. The release build is signed with Expo's bundled debug keystore
# (no secrets required) and embeds the JS bundle, so it runs without a Metro
# dev server.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/upbeat-babbage-5CAxl
    paths:
      - "golden-hour-explorer/**"
      - ".github/workflows/android-apk.yml"

permissions:
  contents: write

concurrency:
  group: android-apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Hard cap so a stuck/OOM Gradle process fails fast instead of hanging until
    # GitHub's 6-hour job limit (which is what happened on the all-ABI build).
    timeout-minutes: 90
    defaults:
      run:
        working-directory: golden-hour-explorer
    env:
      EXPO_NO_TELEMETRY: "1"
      # ubuntu-latest has 4 cores / 16 GB. Give the JVM room and an explicit
      # Metaspace ceiling — the previous all-ABI build died with repeated
      # "OutOfMemoryError: Metaspace" while compiling four ABIs in parallel.
      GRADLE_OPTS: "-Xmx5g -XX:MaxMetaspaceSize=2g -Dorg.gradle.daemon=false -Dorg.gradle.workers.max=3"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: golden-hour-explorer/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Expo prebuild (android)
        run: npx expo prebuild --platform android --no-install

      - name: Patch android project
        working-directory: golden-hour-explorer/android
        run: |
          # Treat Gradle deprecation warnings as warnings only, not errors.
          # Expo SDK 56's generated build scripts use some APIs deprecated in
          # Gradle 9 that would otherwise fail the build before any tasks run.
          echo "org.gradle.warning.mode=all" >> gradle.properties
          # Fix the real cause of "Process 'command 'node'' finished with non-zero
          # exit value 1" at ExpoAutolinkingPlugin.kt:69. That plugin runs
          #   node ... mirror-kotlin-inline-modules --watched-directories-serialized <X>
          # where <X> defaults to a Kotlin emptyList(). Gradle's commandLine(Object...)
          # flattens an empty collection to ZERO args, so node receives the flag with
          # no value and exits 1 ("argument missing"). Setting this property to the
          # string "[]" makes findProperty() return a real value that survives as a
          # single literal arg, and JSON.parse("[]") succeeds.
          echo "expo.inlineModules.watchedDirectories=[]" >> gradle.properties
          # Build native code for a single ABI only. This is the React Native /
          # Expo mechanism the gradle plugin actually honours for the NDK external
          # builds and APK packaging (an ndk.abiFilters edit in app/build.gradle did
          # NOT stop the x86_64 CMake compile last run). One ABI keeps the build
          # well under the timeout and avoids the parallel-compile Metaspace OOM.
          # arm64-v8a covers every modern (2017+) Android phone.
          echo "reactNativeArchitectures=arm64-v8a" >> gradle.properties
          echo "----- gradle.properties tail -----"
          tail -n 5 gradle.properties

      - name: Build release APK
        working-directory: golden-hour-explorer/android
        run: |
          # Ensure the node binary used by ExpoAutolinkingPlugin is in PATH.
          export PATH="$(dirname "$(which node)"):$PATH"
          ./gradlew :app:assembleRelease --no-daemon --stacktrace --warning-mode=all; GRADLE_EXIT=$?
          # "28 actionable tasks: 28 executed" in Gradle means assembleRelease
          # completed. A post-build ExpoAutolinkingPlugin node call can fail and
          # produce a non-zero exit even when the APK was built successfully.
          # Succeed if the APK exists; otherwise propagate Gradle's exit code.
          APK="app/build/outputs/apk/release/app-release.apk"
          if [ -f "$APK" ]; then
            echo "APK produced: $(ls -lh $APK)"
            exit 0
          fi
          echo "APK not found (Gradle exit $GRADLE_EXIT):"
          find app/build/outputs -name "*.apk" 2>/dev/null || true
          exit ${GRADLE_EXIT:-1}

      - name: Stage APK
        run: |
          set -e
          src="android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$src" ]; then
            echo "APK not found at $src" >&2
            find android/app/build/outputs -name "*.apk" -print || true
            exit 1
          fi
          cp "$src" sunspot-golden-hour.apk
          ls -lh sunspot-golden-hour.apk

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: sunspot-golden-hour-apk
          path: golden-hour-explorer/sunspot-golden-hour.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: sunspot-android-latest
          name: "SunSpot · Golden Hour Explorer — Android test build"
          body: |
            Standalone Android APK for sideload testing.

            - Built from `golden-hour-explorer/` via `expo prebuild` + Gradle `assembleRelease`.
            - Embeds the JS bundle (runs without a Metro dev server).
            - Built for **arm64-v8a** — fine for any modern (2017+) physical Android phone;
              it will not run on x86 emulators.
            - Debug-keystore signed — Android will warn it is from an "unknown developer";
              that is expected for a test build. Allow install from your browser/files app.

            Commit: ${{ github.sha }}
          files: golden-hour-explorer/sunspot-golden-hour.apk
          make_latest: "true"
