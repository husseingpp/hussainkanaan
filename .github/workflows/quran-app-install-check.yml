name: APK install check (Quran app)

# Installs published APKs on an emulator and prints Android's own install
# result, which phone installers hide behind "App not installed".

on:
  workflow_dispatch:
    inputs:
      tags:
        description: "Release tags to try, space-separated"
        default: "quran-app-v1.0.22 quran-app-v1.0.23"
  push:
    branches:
      - claude/new-project-wfesil
    paths:
      - ".github/workflows/quran-app-install-check.yml"

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Download APKs
        run: |
          for t in ${{ github.event.inputs.tags || 'quran-app-v1.0.22 quran-app-v1.0.23' }}; do
            curl -sSL -o "$t.apk" "https://github.com/${{ github.repository }}/releases/download/$t/quran-app.apk"
            ls -l "$t.apk"
          done

      - name: Install on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          script: |
            df -h /data 2>/dev/null; adb shell df -h /data
            for f in *.apk; do echo "=== $f"; adb install -r "$f" 2>&1 | tail -3; adb shell pm uninstall net.hussainkanaan.quran_app >/dev/null 2>&1; done
            for f in *.apk; do echo "=== fresh $f"; adb install "$f" 2>&1 | tail -3; adb shell pm uninstall net.hussainkanaan.quran_app >/dev/null 2>&1; done
            adb logcat -d | grep -iE "PackageManager|PackageInstaller|INSTALL_FAILED|installPackage" | tail -60
