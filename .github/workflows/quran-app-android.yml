name: Build Android APK (Quran app)

# Builds an installable test APK of quran-app/ and publishes it to a stable
# GitHub Release for sideloading. The content DB is built fresh from the
# pinned sources: fetch_sources.py downloads them and ingest.py refuses to
# build unless they match sources.lock.json. Signed with Flutter's debug key
# (no secrets), so Android warns it's from an unknown developer.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-project-wfesil
    paths:
      - "quran-app/**"
      - ".github/workflows/quran-app-android.yml"

permissions:
  contents: write

concurrency:
  group: quran-app-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: quran-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download sources
        run: python3 tool/ingest/fetch_sources.py

      - name: Build content DB
        # The calendar pack is a draft until a qualified review (BLUEPRINT §9).
        run: python3 tool/ingest/ingest.py --allow-unreviewed-calendar

      - name: Render all 604 pages (Phase 1 gate)
        run: |
          flutter pub get
          flutter test tool/screenshots/render_pages_test.dart --plain-name "all 604"

      - name: Search on a cold DB (Phase 4 gate)
        run: flutter test tool/screenshots/render_pages_test.dart --plain-name "search gate"

      - name: Build APK
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk quran-app.apk
          ls -lh quran-app.apk

      - uses: actions/upload-artifact@v4
        with:
          name: quran-app-apk
          path: quran-app/quran-app.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: quran-app-android-latest
          name: "Quran app — Android test build"
          body: |
            Installable test build of the Quran app (Phase 1: reader, with page view, reading view, night mode and resume).

            - Content DB built from the pinned sources (Tanzil + Quran Foundation), checked against `sources.lock.json`.
            - Signed with a debug key: Android will warn it's from an unknown developer. Allow installs from your browser/files app.

            Commit: ${{ github.sha }}
          files: quran-app/quran-app.apk
          make_latest: "false"

  # Phase 6 gates against an independent reference. Separate from the APK
  # job so a network hiccup at the reference service never blocks a build.
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: quran-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fetch reference times and dates (AlAdhan)
        run: python3 tool/reference/fetch_reference.py build/reference.json

      - name: Prayer times within a minute; Hijri dates exact (Phase 6 gates)
        run: |
          flutter pub get
          flutter test tool/reference/reference_test.dart --reporter expanded
