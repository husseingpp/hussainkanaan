name: Media notification check (Quran app)

# Plays audio through Listen Mode on an Android emulator and records whether
# Android shows the media notification and lock-screen session, including
# after pause, stop and a second start. The report is uploaded as an artifact.

on:
  workflow_dispatch:
  push:
    branches:
      - claude/new-project-wfesil
    paths:
      - "quran-app/lib/features/listen/**"
      - "quran-app/integration_test/**"
      - "quran-app/tool/ci/**"
      - "quran-app/android/**"
      - ".github/workflows/quran-app-android-media.yml"

concurrency:
  group: quran-app-android-media
  cancel-in-progress: true

jobs:
  media:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: quran-app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Placeholder content DB (the test doesn't read it)
        run: |
          mkdir -p assets/db
          touch assets/db/content.db
          flutter pub get

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          working-directory: quran-app
          script: bash tool/ci/media_check.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: media-report
          path: |
            quran-app/media-report.txt
            quran-app/test.log
