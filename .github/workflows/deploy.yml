name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
      - claude/beautiful-lovelace-rcjqT
      - claude/upbeat-babbage-5CAxl
      - claude/congresstracker-setup-k4fhya
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment, don't cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install portfolio dependencies
        run: npm ci

      - name: Install Expo web app dependencies
        working-directory: golden-hour-explorer
        run: npm ci

      - name: Build Expo web app
        working-directory: golden-hour-explorer
        run: npx expo export --platform web --output-dir web-dist
        env:
          EXPO_NO_TELEMETRY: "1"

      - name: Build portfolio (static export)
        run: npm run build

      - name: Inject Expo web app into portfolio output
        run: |
          mkdir -p out/sunspot-app
          cp -r golden-hour-explorer/web-dist/. out/sunspot-app/

      - name: Inject café footfall report into portfolio output
        run: |
          mkdir -p out/cafe-footfall-tracker
          cp -r cafe-footfall-tracker/docs/. out/cafe-footfall-tracker/

      - name: Install CongressTracker dependencies
        working-directory: congresstracker
        run: npm ci

      - name: Build CongressTracker (static export)
        working-directory: congresstracker
        run: npm run build:static
        env:
          # Public, RLS-gated read-only key — baked into the client bundle so the
          # static site fetches live data in the browser. Also used at build time
          # to pre-render one page per member/bill. Safe to expose.
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Inject CongressTracker into portfolio output
        run: |
          mkdir -p out/congresstracker
          cp -r congresstracker/out/. out/congresstracker/

      - name: Disable Jekyll processing
        run: touch out/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
