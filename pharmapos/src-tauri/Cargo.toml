[package]
name = "pharmapos"
version = "0.1.0"
description = "PharmaPOS — offline-first pharmacy point-of-sale for Lebanon"
authors = ["Hussein Kanaan"]
edition = "2021"
rust-version = "1.77.2"

# See https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids clashing with the binary name on some platforms.
name = "pharmapos_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
