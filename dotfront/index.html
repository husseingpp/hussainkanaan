<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DOTFRONT.io</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #f2efe9;
        font-family: 'Space Grotesk', 'Inter', system-ui, sans-serif;
      }
      #game {
        display: block;
        width: 100vw;
        height: 100vh;
        cursor: crosshair;
      }
      #debug-hud {
        position: fixed;
        top: 8px;
        left: 10px;
        color: #9b9b9b;
        font-size: 12px;
        letter-spacing: 0.04em;
        user-select: none;
        pointer-events: none;
        white-space: pre;
      }
    </style>
  </head>
  <body>
    <canvas id="game"></canvas>
    <div id="debug-hud"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
