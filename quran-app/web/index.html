<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="القرآن الكريم: المصحف والاستماع ومواقيت الصلاة والقبلة والتقويم.">
  <meta name="theme-color" content="#1B5E4A">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="القرآن الكريم">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>القرآن الكريم</title>
  <link rel="manifest" href="manifest.json">
</head>
<body style="margin:0;background:#F4F8F6">
  <!-- Shown until Flutter draws its first frame (the first visit downloads
       the Quran database, ~28 MB). -->
  <div id="loading" style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-family:sans-serif;color:#1B5E4A;font-size:20px;text-align:center">
    القرآن الكريم<br><small style="font-size:14px;opacity:.7">جارٍ التحميل… قد تستغرق الزيارة الأولى دقيقة</small>
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('loading'); if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
